{% extends "market/base.html" %}

{% block title %}{{ page_title }} | Poly Market{% endblock %}

{% block content %}

<div class="pm-page">

    <div class="container">

        <div class="pm-form-container">

            <div class="pm-form-heading">

                <span class="pm-page-label">
                    SELL YOUR ITEM
                </span>

                <h1>{{ page_title }}</h1>

                <p>
                    상품 정보를 입력하고
                    이웃들과 거래를 시작해 보세요.
                </p>

            </div>

            <div class="pm-form-card">

                <form method="post"
                      enctype="multipart/form-data"
                      class="pm-product-form">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="pm-form-actions">

                        <a href="{% url 'product_list' %}"
                           class="btn btn-outline">
                            취소
                        </a>

                        <button type="submit"
                                class="btn btn-primary">
                            저장하기
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
