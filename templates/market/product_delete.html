
{% extends "market/base.html" %}

{% block title %}상품 삭제 | Poly Market{% endblock %}

{% block content %}

<div class="pm-page">

    <div class="container">

        <div class="pm-delete-card">

            <div class="pm-delete-icon">🗑️</div>

            <h1>상품을 삭제하시겠어요?</h1>

            <p>
                <strong>"{{ product.title }}"</strong>
                상품을 정말 삭제하시겠습니까?
            </p>

            <p class="pm-delete-warning">
                삭제한 상품은 복구할 수 없습니다.
            </p>

            <form method="post">

                {% csrf_token %}

                <div class="pm-delete-actions">

                    <a href="{% url 'product_detail' product.id %}"
                       class="btn btn-outline">
                        취소
                    </a>

                    <button type="submit"
                            class="btn pm-danger-button">
                        삭제하기
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
